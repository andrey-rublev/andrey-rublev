<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 161" width="749" height="161" role="img" aria-label="NIKHIL KOLLI">
  <title>NIKHIL KOLLI</title>
  <defs>
    <clipPath id="band">
      <rect class="sweep" x="-150" y="0" width="150" height="161"/>
    </clipPath>
  </defs>
  <style>
    .k{fill:none;stroke-width:22;stroke-linecap:butt;stroke-linejoin:miter}
    .face{stroke:#F0F3F8}
    .shine{stroke:#FFFFFF;opacity:0.55}
    .ltr{animation:rise 620ms cubic-bezier(.2,.85,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .l0{animation-delay:0ms}.l1{animation-delay:52ms}.l2{animation-delay:104ms}.l3{animation-delay:156ms}.l4{animation-delay:208ms}.l5{animation-delay:260ms}.l6{animation-delay:312ms}.l7{animation-delay:364ms}.l8{animation-delay:416ms}.l9{animation-delay:468ms}.l10{animation-delay:520ms}
    /* The band moves, not the letters: translating the clipped group would
       carry its own clip along and nothing would appear to move. */
    .sweep{animation:sweep 4600ms linear infinite}
    @keyframes sweep{
      0%{transform:translateX(0)}
      42%{transform:translateX(899px)}
      100%{transform:translateX(899px)}
    }
  </style>
