<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 126" width="340" height="126" role="img" aria-label="RealTalk">
<title>RealTalk</title>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .t{font-size:15.5px;font-weight:700}
  .d{font-size:12px}
  .c{font-size:10.5px;text-anchor:middle}
  .m{font-size:11px}
  .e{text-anchor:end}
  .dark .t{fill:#E6EDF3} .dark .d{fill:#8B949E} .dark .c{fill:#A5B4FC} .dark .m{fill:#7D8590}
  .light .t{fill:#1F2328} .light .d{fill:#57606A} .light .c{fill:#5B4BD6} .light .m{fill:#6E7781}
  .light{display:none}
  @media (prefers-color-scheme: light){.dark{display:none}.light{display:inline}}
</style>
<g class="dark"><defs><clipPath id="card-dark"><rect x="5.5" y="0.5" width="329" height="117" rx="10"/></clipPath></defs><rect x="5.5" y="0.5" width="329" height="117" rx="10" fill="#0D1117" stroke="#30363D"/><rect x="5.5" y="0.5" width="4" height="117" fill="#818CF8" clip-path="url(#card-dark)"/><text x="25" y="31" class="t">RealTalk</text><text x="25" y="54" class="d">AI hiring assistant that reviews</text><text x="25" y="70" class="d">resumes and runs interviews.</text><rect x="25" y="82" width="42" height="20" rx="5" fill="#21262D"/><text x="46" y="96" class="c">React</text><rect x="74" y="82" width="55" height="20" rx="5" fill="#21262D"/><text x="101" y="96" class="c">FastAPI</text><rect x="135" y="82" width="30" height="20" rx="5" fill="#21262D"/><text x="150" y="96" class="c">AWS</text></g><g class="light"><defs><clipPath id="card-light"><rect x="5.5" y="0.5" width="329" height="117" rx="10"/></clipPath></defs><rect x="5.5" y="0.5" width="329" height="117" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="5.5" y="0.5" width="4" height="117" fill="#5B4BD6" clip-path="url(#card-light)"/><text x="25" y="31" class="t">RealTalk</text><text x="25" y="54" class="d">AI hiring assistant that reviews</text><text x="25" y="70" class="d">resumes and runs interviews.</text><rect x="25" y="82" width="42" height="20" rx="5" fill="#EFF1F5"/><text x="46" y="96" class="c">React</text><rect x="74" y="82" width="55" height="20" rx="5" fill="#EFF1F5"/><text x="101" y="96" class="c">FastAPI</text><rect x="135" y="82" width="30" height="20" rx="5" fill="#EFF1F5"/><text x="150" y="96" class="c">AWS</text></g>
</svg>
