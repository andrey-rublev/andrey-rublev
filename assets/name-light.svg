<svg xmlns="http://www.w3.org/2000/svg" width="760" height="104" viewBox="0 0 760 104" role="img" aria-label="Nikhil Kolli">
  <title>Nikhil Kolli</title>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#1F2328"/>
      <stop offset="0.42" stop-color="#1F2328"/>
      <stop offset="0.50" stop-color="#5B4BD6"/>
      <stop offset="0.58" stop-color="#1F2328"/>
      <stop offset="1.00" stop-color="#1F2328"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .l {
      font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;
      font-size: 54px;
      font-weight: 700;
      fill: url(#shine);
      opacity: 0;
      animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rule { transform-origin: center; animation: draw .9s cubic-bezier(.2,.8,.2,1) .55s forwards; }
    @keyframes draw { from { transform: scaleX(0); opacity: 0 } to { transform: scaleX(1); opacity: .75 } }
    @media (prefers-reduced-motion: reduce) {
      .l, .rule { animation: none; opacity: 1; }
      .rule { opacity: .75 }
    }
  </style>
  <g>
    <text class="l" style="animation-delay:0ms" x="179.8" y="70" text-anchor="middle">N</text>
    <text class="l" style="animation-delay:55ms" x="216.2" y="70" text-anchor="middle">I</text>
    <text class="l" style="animation-delay:110ms" x="252.6" y="70" text-anchor="middle">K</text>
    <text class="l" style="animation-delay:165ms" x="289.0" y="70" text-anchor="middle">H</text>
    <text class="l" style="animation-delay:220ms" x="325.4" y="70" text-anchor="middle">I</text>
    <text class="l" style="animation-delay:275ms" x="361.8" y="70" text-anchor="middle">L</text>
    
    <text class="l" style="animation-delay:385ms" x="434.6" y="70" text-anchor="middle">K</text>
    <text class="l" style="animation-delay:440ms" x="471.0" y="70" text-anchor="middle">O</text>
    <text class="l" style="animation-delay:495ms" x="507.4" y="70" text-anchor="middle">L</text>
    <text class="l" style="animation-delay:550ms" x="543.8" y="70" text-anchor="middle">L</text>
    <text class="l" style="animation-delay:605ms" x="580.2" y="70" text-anchor="middle">I</text>
  </g>
  <rect class="rule" x="163.60000000000002" y="88" width="432.8" height="2" rx="1" fill="#5B4BD6" opacity="0"/>
</svg>