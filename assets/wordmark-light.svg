<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.5 162.9" width="841.5" height="162.9" role="img" aria-label="NIKHIL KOLLI">
<title>NIKHIL KOLLI</title>
<defs>
  <clipPath id="band">
    <rect class="sweep" x="-150" y="0" width="150" height="162.9"/>
  </clipPath>
</defs>
<style>
@font-face{font-family:'BShade';src:url(data:font/woff2;base64,) format('woff2');font-display:block}
@font-face{font-family:'BFace';src:url(data:font/woff2;base64,) format('woff2');font-display:block}
text{font-size:84px;text-anchor:start}
.sh{font-family:'BShade',sans-serif;fill:#7C70E4}
.fc{font-family:'BFace',sans-serif;fill:#16181D}
.sw{font-family:'BFace',sans-serif;fill:#A5B4FC;opacity:0.45}
text{animation:rise 620ms cubic-bezier(.2,.85,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.c0{animation-delay:0ms}.c1{animation-delay:46ms}.c2{animation-delay:92ms}.c3{animation-delay:138ms}.c4{animation-delay:184ms}.c5{animation-delay:230ms}.c6{animation-delay:276ms}.c7{animation-delay:322ms}.c8{animation-delay:368ms}.c9{animation-delay:414ms}.c10{animation-delay:460ms}
/* The band moves, not the letters: translating the clipped group would carry
   its own clip along and nothing would appear to move. */
.sweep{animation:sweep 4800ms linear infinite}
@keyframes sweep{0%{transform:translateX(0)}44%{transform:translateX(991.5px)}100%{transform:translateX(991.5px)}}
</style>
