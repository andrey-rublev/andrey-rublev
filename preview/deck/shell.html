<header class="deck-head"><h2 id="film-title">The topographic deck</h2><div class="deck-actions"><button type="button" data-film-motion>Show still</button>{{CLOSE}}</div></header>
<div class="deck-stage"><picture><source type="image/avif" data-avif="{{AVIF}}"><img data-film="{{MOVIE}}" data-still="{{STILL}}" alt="The deck bends, then springs face-up one card at a time. The ace flips once in the air, lands face-up, and pivots over the opening fan."></picture></div>
<div class="deck-orbit" hidden><div class="deck-tricks"><label><select data-cue aria-label="Jump to a card trick"><option value="">Jump to a trick</option></select></label><span>Drag to orbit</span></div><div role="group" aria-label="Viewing angle">
<button type="button" data-orbit="left" aria-label="Orbit left" title="Orbit left">←</button>
<button type="button" data-orbit="right" aria-label="Orbit right" title="Orbit right">→</button>
<button type="button" data-orbit="up" aria-label="Tilt up" title="Tilt up">↑</button>
<button type="button" data-orbit="down" aria-label="Tilt down" title="Tilt down">↓</button>
<button type="button" data-orbit="reset">Reset view</button></div></div>
