name: Contribution graph

# Redraws the contribution board - assets/contrib-*.svg, see
# assets/build_contrib.py - from the GitHub API, restamps the README's asset
# URLs so the new files are new cache keys, and commits both. Runs daily.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/build_contrib.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

# The card workflow also commits README.md; one at a time.
concurrency:
  group: readme-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For font metrics. The subsets themselves are committed, so nothing is
      # downloaded from Google Fonts here.
      - run: pip install "fonttools==4.*" brotli

      - name: Draw the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python assets/build_contrib.py
          python assets/fingerprint.py

      - name: Commit and push
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add assets/contrib-*.svg README.md
          # Nothing changed on a quiet day, and that must not fail the run.
          if git commit -m "chore: redraw contribution graph"; then
            git pull --rebase origin main
            git push
          fi
