name: 3D contribution graph

# Renders the contribution calendar as an isometric 3D SVG and commits it back
# to this repo. Runs daily; the README points at the committed files.
# Source: github.com/yoshi389111/github-profile-3d-contrib (MIT)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add -A .
          # Nothing changed on a quiet day, and that must not fail the run.
          if git commit -m "chore: regenerate 3D contribution graph"; then
            git push
          fi
